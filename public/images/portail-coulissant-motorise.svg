<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gateSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="pillarStone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="gateAnthracite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Sky & Landscape Background -->
  <rect width="800" height="380" fill="url(#gateSky)"/>
  <!-- Mediterranean Foliage silhouettes -->
  <path d="M0 380 Q100 320 200 380 Q300 310 400 380 Q500 330 600 380 Q700 300 800 380 L800 380 L0 380 Z" fill="#15803D" opacity="0.4"/>

  <!-- Driveway Paved Ground -->
  <rect y="380" width="800" height="220" fill="#334155"/>
  <rect y="380" width="800" height="15" fill="#475569"/>

  <!-- Left Stone Pillar -->
  <rect x="60" y="160" width="100" height="260" rx="4" fill="url(#pillarStone)" stroke="#94A3B8" stroke-width="2"/>
  <rect x="50" y="145" width="120" height="20" rx="4" fill="#CBD5E1"/>

  <!-- Right Stone Pillar with Flashing Safety Light -->
  <rect x="640" y="160" width="100" height="260" rx="4" fill="url(#pillarStone)" stroke="#94A3B8" stroke-width="2"/>
  <rect x="630" y="145" width="120" height="20" rx="4" fill="#CBD5E1"/>
  <!-- Amber Flashing Beacon -->
  <rect x="675" y="115" width="30" height="30" rx="6" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
  <circle cx="690" cy="130" r="8" fill="#FEF08A"/>

  <!-- Motorized Sliding Gate (Anthracite horizontal louvers) -->
  <g transform="translate(180, 180)">
    <!-- Gate Frame -->
    <rect x="0" y="0" width="440" height="230" rx="8" fill="url(#gateAnthracite)" stroke="#475569" stroke-width="4"/>

    <!-- Horizontal Modern Slats -->
    <rect x="15" y="20" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="46" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="72" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="98" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="124" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="150" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="176" width="410" height="18" rx="2" fill="#334155"/>
    <rect x="15" y="202" width="410" height="18" rx="2" fill="#334155"/>

    <!-- Steel Toothed Rack (Crémaillère) at bottom -->
    <rect x="-10" y="222" width="460" height="8" fill="#94A3B8"/>
  </g>

  <!-- Electric Motor Unit on Right Base (Came / FAAC) -->
  <rect x="610" y="370" width="55" height="50" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <circle cx="637" cy="395" r="10" fill="#334155"/>
  <circle cx="637" cy="395" r="4" fill="#F59E0B"/>

  <!-- Safety Photocell Beam Sensors -->
  <rect x="150" y="360" width="16" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="158" cy="372" r="3" fill="#EF4444"/>
  <rect x="635" y="330" width="16" height="24" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="643" cy="342" r="3" fill="#EF4444"/>

  <!-- Ground Stainless Rail -->
  <rect x="100" y="414" width="600" height="8" fill="#CBD5E1"/>
  <rect x="100" y="416" width="600" height="2" fill="#FFFFFF"/>

  <!-- Badge Overlay -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="110" y="18" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">PORTAIL COULISSANT 24V</text>
  </g>
</svg>
