<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="shutterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="steelLath" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#shutterBg)"/>

  <!-- Storeframe Outline -->
  <rect x="70" y="40" width="660" height="520" rx="10" fill="#1E293B" stroke="#334155" stroke-width="4"/>

  <!-- Top Rolling Box / Coffre d'enroulement -->
  <rect x="100" y="70" width="600" height="80" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="115" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="2">RIDEAU MÉTALLIQUE MOTORISÉ • SÉCURITÉ MAGASIN</text>

  <!-- Side Guides / Coulisses -->
  <rect x="120" y="150" width="24" height="400" fill="#334155" stroke="#475569" stroke-width="1"/>
  <rect x="656" y="150" width="24" height="400" fill="#334155" stroke="#475569" stroke-width="1"/>

  <!-- Steel Curtain Laths (Micro-perforated & solid) -->
  <g transform="translate(144, 150)">
    <!-- Generating 16 horizontal curtain slats -->
    <rect x="0" y="0" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="24" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="48" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="72" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="96" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="120" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="144" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="168" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="192" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="216" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="240" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="264" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="288" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="312" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="336" width="512" height="22" rx="2" fill="url(#steelLath)" stroke="#475569" stroke-width="1"/>
    <rect x="0" y="360" width="512" height="30" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <!-- Bottom Lock / Serrures à canon européen -->
    <circle cx="256" cy="375" r="5" fill="#F59E0B"/>
  </g>

  <!-- Key Switch Control Box on Wall -->
  <g transform="translate(695, 340)">
    <rect x="0" y="0" width="28" height="42" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="14" cy="21" r="5" fill="#E2E8F0"/>
    <rect x="13" y="19" width="2" height="6" fill="#0F172A"/>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(70, 60)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="115" y="18" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">RIDEAU FERMETURE 06</text>
  </g>
</svg>
